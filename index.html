<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grok Chat — AI Assistant</title>
<meta name="description" content="Grok Chat AI workspace">
<meta name="theme-color" content="#ffffff">
<script src="https://js.puter.com/v2/"></script>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark">✦</div>
      <div class="brand-name">Grok Chat</div>
      <button class="close-mobile" aria-label="ปิดเมนู" onclick="document.querySelector('#sidebar').classList.remove('open')">×</button>
    </div>

    <div class="side-content">
      <button id="newChat" class="new-chat"><span>＋</span> บทสนทนาใหม่</button>
      <label class="search">
        <span>⌕</span>
        <input type="search" placeholder="ค้นหาบทสนทนา" aria-label="ค้นหาบทสนทนา">
      </label>
      <div class="empty-history">ยังไม่มีบทสนทนาที่บันทึกไว้</div>
    </div>

    <div class="side-account">
      <button class="signin">↪ <span>ลงชื่อเข้าใช้เพื่อบันทึกแชท</span></button>
      <small>ยังไม่ลงชื่อเข้าใช้ — บทสนทนาจะอยู่แค่ในหน้านี้</small>
    </div>
  </aside>

  <div class="overlay" onclick="document.querySelector('#sidebar').classList.remove('open')"></div>

  <main>
    <header>
      <button class="mobile-menu" aria-label="เปิดเมนู" onclick="document.querySelector('#sidebar').classList.add('open')">☰</button>
      <div class="chat-heading">
        <b>บทสนทนาใหม่</b>
        <small id="status">ยังไม่ได้บันทึก</small>
      </div>
      <div class="tools">
        <div class="select-wrap">
          <select id="mode" aria-label="โหมด">
            <option value="fast">เร็วสุด</option>
            <option value="balanced">สมดุล</option>
            <option value="deep">คิดลึก</option>
            <option value="agents">ทีมเอเจนต์</option>
          </select>
        </div>
        <div class="select-wrap model-select">
          <span class="cpu">◫</span>
          <select id="model" aria-label="โมเดล">
            <option value="x-ai/grok-4.6">Grok 4.6</option>
            <option value="x-ai/grok-4-fast">Grok 4 Fast</option>
            <option value="gpt-5-nano">GPT-5 Nano</option>
            <option value="google/gemini-2.5-flash">Gemini</option>
            <option value="claude-sonnet-4-5">Claude</option>
            <option value="deepseek-chat">DeepSeek</option>
          </select>
        </div>
        <button id="clear" class="icon" title="ล้างบทสนทนา" aria-label="ล้างบทสนทนา">⌫</button>
      </div>
    </header>

    <section id="messages" aria-live="polite"></section>

    <footer>
      <div class="composer-wrap">
        <div class="mode-pills">
          <span class="pill active">◔ เร็วสุด</span>
          <span class="pill selected">✦ สมดุล</span>
          <span class="pill">◉ คิดลึก</span>
          <span class="pill">♧ ทีมเอเจนต์</span>
        </div>
        <div class="composer">
          <textarea id="input" rows="1" placeholder="ส่งข้อความถึง Grok…" aria-label="ข้อความ"></textarea>
          <div class="composer-bottom">
            <button class="stream">ϟ <span>สตรีมมิ่ง</span></button>
            <button id="send" class="send" aria-label="ส่งข้อความ">↑</button>
          </div>
        </div>
        <small class="disclaimer">โมเดลอาจให้ข้อมูลผิดพลาดได้ — ควรตรวจสอบข้อมูลสำคัญอีกครั้ง</small>
      </div>
    </footer>
  </main>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
