<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grok Chat — AI Assistant</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><script src="https://js.puter.com/v2/"></script><link rel="stylesheet" href="css/styles.css"></head><body><div id="app"><aside id="sidebar"><div class="brand">✦ <b>Grok Chat</b><button id="closeSidebar">×</button></div><button id="newChatBtn" class="primary">＋ บทสนทนาใหม่</button><input id="searchInput" placeholder="ค้นหาบทสนทนา"><nav id="convList"></nav><div id="authBox"></div></aside><main><header><button id="openSidebar">☰</button><div><b id="chatTitle">บทสนทนาใหม่</b><small id="chatMeta">ยังไม่ได้บันทึก</small></div><div class="header-actions"><button id="tabChat" class="tab-btn active">Chat</button><button id="tabView" class="tab-btn">View <span id="viewBadge"></span></button><select id="modelSelect"></select><button id="clearBtn">🗑</button></div></header><section id="messages"></section><section id="viewPane" hidden><div class="viewbar"><select id="artifactSelect"></select><button id="artCopy">คัดลอก</button><button id="artDownload">ดาวน์โหลด</button><button id="artNewTab">แท็บใหม่</button></div><div id="viewBody"></div></section><footer><div id="modeRow"></div><div class="composer"><textarea id="input" rows="1" placeholder="ส่งข้อความถึง Grok…"></textarea><div class="tools"><button id="streamToggle">⚡ สตรีมมิ่ง</button><span id="tokenHint"></span><button id="stopBtn" hidden>หยุด</button><button id="sendBtn" class="primary">ส่ง</button></div></div></footer></main></div><div id="toast" class="toast" hidden></div><script type="module" src="js/app.js"></script></body></html>
